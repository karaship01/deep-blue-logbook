<table class="table table-hover mb-3">
    <tr>
        <td width="70px">
            <a href="{{ url_for('user', username=post.author.username) }}">
                <img src="{{ post.author.avatar(70) }}" />
            </a>
        </td>
        <td>
            <a href="{{ url_for('user', username=post.author.username) }}">
                {{ post.author.username }}
            </a> 
            <span class="text-muted">
                {{ moment(post.timestamp).fromNow() }} dedi ki:
            </span>
            <br>
            {{ post.body }}
        </td>
    </tr>
</table>
